<meta name="theme-color" content="#14161c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: 1–4 pionowe tabliczki graczy + pasek tury na dole, jeden ekran telefonu */
:root{
  --bg:#14161c; --panel:#1e212a; --line:#2e3240; --fg:#ece6d6; --muted:#8d8a80;
  --gold:#d9a93f; --combat:#c8503c; --heal:#4fa36b; --active:#d9a93f;
  --display:"Cinzel",Georgia,serif; --num:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--num);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  box-sizing:border-box;display:flex;flex-direction:column;gap:10px;-webkit-tap-highlight-color:transparent;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.06em;margin:0;color:var(--gold)}
.hdr-r{display:flex;gap:8px;align-items:center}
button{font-family:var(--num);font-weight:700;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:active{transform:scale(.96)}
#count{display:flex;align-items:center;gap:4px}
#count .l{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
#count button{width:34px;height:34px;font-size:1rem;padding:0}
#count button.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
#reset{font-size:.95rem;padding:8px 12px;letter-spacing:.04em}
.hist{width:38px;height:36px;font-size:1.3rem;padding:0;line-height:1}
.hist:disabled{opacity:.35;cursor:default}
.hist:disabled:active{transform:none}
#reset.armed{background:var(--combat);border-color:var(--combat)}
#players{flex:1;display:grid;gap:10px;grid-template-rows:repeat(var(--n,3),1fr);min-height:0}
.p{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;
  grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:4px 10px;min-height:0;position:relative}
.p.active{border-color:var(--active);box-shadow:inset 0 0 0 1px var(--active)}
.p.dead .hp{color:var(--muted);text-decoration:line-through}
.name{font-family:var(--display);font-weight:600;font-size:1rem;background:none;border:0;color:var(--fg);padding:2px 0;min-width:0;width:100%}
.turn{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;color:var(--muted)}
.p.active .turn{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.row{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:0}
.hp{flex:1;text-align:center;font-size:clamp(2.6rem,calc(38vh / var(--n,3)),6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hp small{display:block;font-size:.8rem;font-weight:500;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.col{display:flex;flex-direction:column;gap:6px}
.col button{width:56px;height:42px;font-size:1.25rem}
[data-n="4"] .p{padding:6px 10px;gap:2px 10px}
[data-n="4"] .col{gap:4px}
[data-n="4"] .col button{height:34px;font-size:1.1rem}
[data-n="4"] .hp small{display:none}
.minus button{color:#f0a493}
.plus button{color:#9fd8ad}
.delta{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:1.1rem;font-weight:700;opacity:0;transition:opacity .3s}
.delta.show{opacity:1}
#bar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res{display:flex;align-items:center;gap:6px;flex:1;min-width:130px}
.res span.l{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;width:44px}
.res b{font-size:1.8rem;width:36px;text-align:center;font-variant-numeric:tabular-nums}
.res button{width:36px;height:36px;font-size:1.1rem}
.g .l,.g b{color:var(--gold)} .c .l,.c b{color:var(--combat)}
#hit{background:var(--combat);border-color:var(--combat);font-size:.95rem;padding:8px 10px}
#end{background:var(--gold);border-color:var(--gold);color:var(--bg);font-size:.95rem;padding:8px 12px;letter-spacing:.04em}
#hitpick{width:100%;display:flex;gap:6px;flex-wrap:wrap}
#hitpick button{flex:1;padding:8px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.delta{transition:none}button:active{transform:none}}
</style>
</head>
<body>

<header>
  <h1>Hero Realms</h1>
  <div class="hdr-r">
    <div id="count" role="group" aria-label="Liczba graczy"><span class="l">Gracze</span></div>
    <button id="undo" class="hist" type="button" aria-label="Cofnij" title="Cofnij">↶</button>
    <button id="redo" class="hist" type="button" aria-label="Ponów" title="Ponów">↷</button>
    <button id="reset" type="button">Nowa gra</button>
  </div>
</header>
<main id="players"></main>
<section id="bar" aria-label="Tura">
  <div class="res g"><span class="l">Złoto</span><button type="button" data-r="gold" data-d="-1">−</button><b id="gold">0</b><button type="button" data-r="gold" data-d="1">+</button></div>
  <div class="res c"><span class="l">Walka</span><button type="button" data-r="combat" data-d="-1">−</button><b id="combat">0</b><button type="button" data-r="combat" data-d="1">+</button></div>
  <button id="hit" type="button">Atakuj</button>
  <button id="end" type="button">Koniec tury</button>
  <div id="hitpick" hidden></div>
</section>

<script>
const START=50, KEY="hr3", MAX=4;
const fresh=()=>({n:3,players:[1,2,3,4].map(k=>({name:"Gracz "+k,hp:START})),active:0,gold:0,combat:0});
let s; try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!s||!s.players)s=fresh();
while(s.players.length<MAX)s.players.push({name:"Gracz "+(s.players.length+1),hp:START});
if(!s.n)s.n=3;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const P=document.getElementById("players"), timers=[], acc=[0,0,0,0];
const live=()=>s.players.slice(0,s.n);
const past=[], future=[];
const snap=()=>{past.push(JSON.stringify(s)); if(past.length>200)past.shift(); future.length=0};
function travel(from,to){
  if(!from.length)return;
  const names=s.players.map(p=>p.name);
  to.push(JSON.stringify(s)); s=JSON.parse(from.pop());
  s.players.forEach((p,i)=>p.name=names[i]);
  document.getElementById("hitpick").hidden=true; build(); render();
}
document.getElementById("undo").onclick=()=>travel(past,future);
document.getElementById("redo").onclick=()=>travel(future,past);

const C=document.getElementById("count");
for(let k=1;k<=MAX;k++){const b=document.createElement("button");b.type="button";b.textContent=k;b.dataset.k=k;
  b.onclick=()=>{if(s.n===k)return;snap();s.n=k;if(s.active>=k)s.active=0;document.getElementById("hitpick").hidden=true;build();render()};C.appendChild(b)}

function build(){
  P.innerHTML=""; document.body.dataset.n=s.n; P.style.setProperty("--n",s.n); document.body.style.setProperty("--n",s.n);
  live().forEach((p,i)=>{
    const el=document.createElement("div"); el.className="p"; el.id="p"+i;
    el.innerHTML=`<input class="name" id="name${i}" value="" maxlength="16" aria-label="Imię gracza">
      <button class="turn" type="button">Tura</button>
      <div class="row">
        <div class="col minus"><button type="button" data-d="-1">−1</button><button type="button" data-d="-5">−5</button></div>
        <div class="hp"><span>0</span><small>Wpływ</small></div>
        <div class="col plus"><button type="button" data-d="1">+1</button><button type="button" data-d="5">+5</button></div>
      </div><div class="delta"></div>`;
    const inp=el.querySelector(".name"); inp.value=p.name;
    inp.oninput=()=>{p.name=inp.value;save()};
    el.querySelector(".turn").onclick=()=>{if(s.active===i)return;snap();s.active=i;s.gold=0;s.combat=0;render()};
    el.querySelectorAll(".col button").forEach(b=>b.onclick=()=>{snap();change(i,+b.dataset.d)});
    P.appendChild(el);
  });
}
function change(i,d){
  const p=s.players[i]; p.hp=Math.max(0,p.hp+d); acc[i]+=d;
  const el=document.querySelector(`#p${i} .delta`);
  el.textContent=(acc[i]>0?"+":"")+acc[i]; el.style.color=acc[i]<0?"var(--combat)":"var(--heal)"; el.classList.add("show");
  clearTimeout(timers[i]); timers[i]=setTimeout(()=>{el.classList.remove("show");acc[i]=0},1400);
  render();
}
function render(){
  live().forEach((p,i)=>{
    const el=document.getElementById("p"+i);
    el.querySelector(".hp span").textContent=p.hp;
    el.classList.toggle("active",i===s.active); el.classList.toggle("dead",p.hp<=0);
  });
  C.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.k===s.n));
  document.getElementById("gold").textContent=s.gold;
  document.getElementById("combat").textContent=s.combat;
  document.getElementById("undo").disabled=!past.length;
  document.getElementById("redo").disabled=!future.length;
  save();
}
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=b.dataset.r;if(s[r]+ +b.dataset.d<0)return;snap();s[r]=Math.max(0,s[r]+ +b.dataset.d);render()});
document.getElementById("end").onclick=()=>{
  snap(); let n=s.active; for(let k=0;k<s.n;k++){n=(n+1)%s.n; if(s.players[n].hp>0)break}
  s.active=n; s.gold=0; s.combat=0; document.getElementById("hitpick").hidden=true; render();
};
const pick=document.getElementById("hitpick");
document.getElementById("hit").onclick=()=>{
  if(!pick.hidden){pick.hidden=true;return}
  pick.innerHTML="";
  live().forEach((p,i)=>{ if(i===s.active||p.hp<=0)return;
    const b=document.createElement("button"); b.type="button"; b.textContent=`${p.name} −${s.combat}`;
    b.onclick=()=>{ if(s.combat>0){snap();change(i,-s.combat); s.combat=0;} pick.hidden=true; render(); };
    pick.appendChild(b);
  });
  pick.hidden=false;
};
const R=document.getElementById("reset"); let armT;
R.onclick=()=>{
  if(R.classList.contains("armed")){snap();const names=s.players.map(p=>p.name),n=s.n;s=fresh();s.n=n;s.players.forEach((p,i)=>p.name=names[i]);R.classList.remove("armed");R.textContent="Nowa gra";build();render();return}
  R.classList.add("armed"); R.textContent="Na pewno?"; clearTimeout(armT);
  armT=setTimeout(()=>{R.classList.remove("armed");R.textContent="Nowa gra"},3000);
};
build(); render();
</script>
</body>
</html>
